<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Event</title>
</head>
<body>
    <input type="text" id="input-event" placeholder="Type something...">
    <script>
        const inputEvent=document.querySelector("#input-event");
        inputEvent.addEventListener("input",(event)=>{
            console.log(`Input event: ${event.target.value}`);
        });    
        inputEvent.addEventListener("change",(event)=>{
            console.log(`Change event: ${event.target.value}`);
            console.log(`You changed the input to: ${event.target.value}`);
        });
    </script>
</body>
</html>
